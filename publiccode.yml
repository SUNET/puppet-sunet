publiccodeYmlVersion: "0"

name: puppet-sunet
url: "https://github.com/SUNET/puppet-sunet"
platforms:
  - linux

categories:
  - it-service-management

developmentStatus: stable

softwareType: "standalone/other"

description:
  en:
    shortDescription: >
      Puppet classes for configurstion management. 

    longDescription: >
      Puppet classes and utilities used by SUNET for configuration
      management of the operational infrastructure across hosts. The
      repository collects shared classes, defined types and helper scripts
      used in day-to-day SUNET ops.

    features:
      - Configuration management

