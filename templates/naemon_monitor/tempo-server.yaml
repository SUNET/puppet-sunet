stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: info

query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09
  trace_by_id:
    duration_slo: 5s

distributor:
  receivers:                           # this configuration will listen on all ports and protocols that tempo is capable of.
    jaeger:                            # the receives all come from the OpenTelemetry collector.  more configuration information can
      protocols:                       # be found there: https://github.com/open-telemetry/opentelemetry-collector/tree/main/receiver
        thrift_http:                   #
        grpc:                          # for a production deployment you should only enable the receivers you need!
        thrift_binary:
        thrift_compact:
    zipkin:
    otlp:
      protocols:
        http:
          endpoint: ":4318"
        grpc:
          endpoint: ":4317"
<% unless @tempo_v3_1_plus -%>
    opencensus:                        # removed in Tempo 3.0
<% end -%>

<% if @tempo_v3_1_plus -%>
# Tempo 3.x: the compactor is replaced by the backend scheduler/worker,
# which handle retention. Both must be set, otherwise retention falls back to 336h.
backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: <%= @otel_retention %>

backend_worker:
  compaction:
    block_retention: <%= @otel_retention %>
<% else -%>
compactor:
  compaction:
    block_retention: <%= @otel_retention %>
<% end -%>

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: docker-compose
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9009/api/v1/write
        send_exemplars: true
<% unless @tempo_v3_1_plus -%>
  traces_storage:                      # only used by the local-blocks processor (2.x)
    path: /var/tempo/generator/traces
<% end -%>

storage:
  trace:
    backend: local                     # backend configuration to use
    wal:
      path: /var/tempo/wal             # where to store the wal locally
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
<% if @tempo_v3_1_plus -%>
      processors: [service-graphs, span-metrics] # enables metrics generator (local-blocks removed in 3.x)
<% else -%>
      processors: [service-graphs, span-metrics, local-blocks] # enables metrics generator
<% end -%>
