[log]
mode = console
level = <%= @grafana_log_level %>

[server]
root_url = https://<%= @domain %>/grafana/

[users]
default_theme = light
allow_sign_up = false
auto_assign_org_role = <%= @grafana_default_role %>

[auth]
disable_signout_menu = true

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 60

[alerting]
enabled = false

[unified_alerting]
enabled = true

[security]
allow_embedding = true

[analytics]
reporting_enabled = false
<% if @grafana_v13_plus -%>

# Grafana 13 disables scripted dashboards by default, which breaks the Histou
# performance graphs (histou.js is a scripted dashboard). Re-enable them until
# Histou is replaced: scripted dashboards are removed entirely in Grafana 14.
[feature_toggles]
disableScriptedDashboards = false
<% if @grafana_visual_refresh -%>
# Opt in to the new visual UI (public preview since Grafana 13.3, ignored by older 13.x)
grafana.visualDesignRefresh = true
<% end -%>
<% end -%>
