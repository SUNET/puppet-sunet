checks:
- clean initdb
- pg_isready
- SCRAM connection
- restart with populated PGDATA
datasets:
  database:
    access: rw
    gid: 70
    kind: dir
    target: /var/lib/postgresql
    type: sunet_podman2_postgres_database_t
    uid: 70
dependencies: []
domain: sunet_podman2_postgres_t
executables:
- access: runtime
  path: /usr/local/bin/docker-entrypoint.sh
  type: sunet_podman2_postgres_entry_exec_t
  target: /usr/local/bin/docker-entrypoint.sh
  alias_targets: {}
  interpreter:
  - /bin/busybox
  - bash
- access: both
  aliases:
  - /bin/sh
  - /usr/bin/awk
  - /usr/bin/id
  - /bin/ls
  - /bin/cat
  - /bin/chmod
  - /bin/mkdir
  - /bin/mountpoint
  path: /usr/bin/env
  type: sunet_podman2_postgres_busybox_exec_t
  target: /bin/busybox
  alias_targets:
    /bin/sh: /bin/busybox
    /usr/bin/awk: /bin/busybox
    /usr/bin/id: /bin/busybox
    /bin/ls: /bin/busybox
    /bin/cat: /bin/busybox
    /bin/chmod: /bin/busybox
    /bin/mkdir: /bin/busybox
    /bin/mountpoint: /bin/busybox
- access: child
  path: /bin/bash
  type: sunet_podman2_postgres_bash_exec_t
  target: /bin/bash
  alias_targets: {}
- access: child
  path: /usr/bin/getent
  type: sunet_podman2_postgres_getent_exec_t
  target: /usr/bin/getent
  alias_targets: {}
- access: child
  path: /usr/local/bin/initdb
  type: sunet_podman2_postgres_initdb_exec_t
  target: /usr/local/bin/initdb
  alias_targets: {}
- access: child
  path: /usr/local/bin/postgres
  type: sunet_podman2_postgres_postgres_exec_t
  target: /usr/local/bin/postgres
  alias_targets: {}
- access: child
  path: /usr/local/bin/pg_ctl
  type: sunet_podman2_postgres_pg_ctl_exec_t
  target: /usr/local/bin/pg_ctl
  alias_targets: {}
- access: child
  path: /usr/local/bin/psql
  type: sunet_podman2_postgres_psql_exec_t
  target: /usr/local/bin/psql
  alias_targets: {}
- access: runtime
  path: /usr/local/bin/pg_isready
  type: sunet_podman2_postgres_pg_isready_exec_t
  target: /usr/local/bin/pg_isready
  alias_targets: {}
module: sunet_podman2_postgres
revision: '1'
tag: docker.io/library/postgres:18-alpine
platform: linux/amd64
startup:
  Entrypoint:
  - docker-entrypoint.sh
  Cmd:
  - postgres
  User: null
  WorkingDir: /
  config_sha256: f47c2b17fdbb6d5a4820a1fb7dbdf85dfac45bed43001168fc885ef2bf966a59
unit_contract:
  User: 70:70
  HealthCmd: '["/usr/local/bin/pg_isready","-U","postgres"]'
