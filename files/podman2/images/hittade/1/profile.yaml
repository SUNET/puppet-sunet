checks:
- Django migrate
- warmservercache
- sass build
- collectstatic
- three Granian workers
- read-only report import
datasets:
  certificates:
    access: ro
    gid: 999
    kind: dir
    target: /app/certificates
    type: sunet_podman2_hittade_certificates_t
    uid: 999
  css:
    access: rw
    gid: 999
    kind: dir
    target: /app/static/css
    type: sunet_podman2_hittade_css_t
    uid: 999
  hosts:
    access: ro
    gid: 999
    kind: dir
    target: /hosts
    type: sunet_podman2_invent_receiver_hosts_t
    uid: 999
  proxy:
    access: ro
    gid: 999
    kind: file
    target: /app/proxy.xml
    type: sunet_podman2_hittade_proxy_t
    uid: 999
  settings:
    access: ro
    gid: 999
    kind: file
    target: /app/hittade/localsettings.py
    type: sunet_podman2_hittade_settings_t
    uid: 999
  staticfiles:
    access: rw
    gid: 999
    kind: dir
    target: /app/staticfiles
    type: sunet_podman2_hittade_staticfiles_t
    uid: 999
  urls:
    access: ro
    gid: 999
    kind: file
    target: /app/hittade/urls.py
    type: sunet_podman2_hittade_urls_t
    uid: 999
dependencies:
- sunet_podman2_invent_receiver
domain: sunet_podman2_hittade_t
executables:
- access: runtime
  path: /app/docker-entrypoint.sh
  type: sunet_podman2_hittade_entry_exec_t
  target: /app/docker-entrypoint.sh
  alias_targets: {}
  interpreter:
  - /usr/bin/bash
- access: both
  path: /bin/bash
  type: sunet_podman2_hittade_bash_exec_t
  target: /usr/bin/bash
  alias_targets: {}
- access: child
  path: /usr/bin/sleep
  type: sunet_podman2_hittade_sleep_exec_t
  target: /usr/bin/sleep
  alias_targets: {}
- access: both
  path: /app/bin/python
  type: sunet_podman2_hittade_python_exec_t
  target: /usr/local/bin/python3.13
  alias_targets: {}
- access: child
  path: /usr/local/bin/sass
  type: sunet_podman2_hittade_sass_exec_t
  target: /opt/dart-sass/sass
  alias_targets: {}
  interpreter:
  - /usr/bin/dash
- access: child
  path: /bin/sh
  type: sunet_podman2_hittade_dash_exec_t
  target: /usr/bin/dash
  alias_targets: {}
- access: child
  path: /usr/bin/dirname
  type: sunet_podman2_hittade_dirname_exec_t
  target: /usr/bin/dirname
  alias_targets: {}
- access: child
  path: /usr/bin/readlink
  type: sunet_podman2_hittade_readlink_exec_t
  target: /usr/bin/readlink
  alias_targets: {}
- access: child
  path: /opt/dart-sass/src/dart
  type: sunet_podman2_hittade_dart_exec_t
  target: /opt/dart-sass/src/dart
  alias_targets: {}
- access: child
  path: /app/bin/granian
  type: sunet_podman2_hittade_granian_exec_t
  target: /app/bin/granian
  alias_targets: {}
  interpreter:
  - /usr/local/bin/python3.13
module: sunet_podman2_hittade
revision: '1'
tag: docker.sunet.se/hittade-server:0.2.0
platform: linux/amd64
startup:
  Entrypoint: null
  Cmd:
  - python3
  User: app
  WorkingDir: /app
  config_sha256: 36e9d8fecebe6ecd533de878357b6e09b6fcd667c58bbb54bb287b1c62dc0a5b
unit_contract:
  Exec: /app/docker-entrypoint.sh
