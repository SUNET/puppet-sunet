checks:
- redis-cli ping
- persist data
- restart and retrieve
datasets:
  data:
    access: rw
    gid: 1000
    kind: dir
    target: /data
    type: sunet_podman2_redis_data_t
    uid: 999
dependencies: []
domain: sunet_podman2_redis_t
executables:
- access: runtime
  path: /usr/local/bin/docker-entrypoint.sh
  type: sunet_podman2_redis_entry_exec_t
  target: /usr/local/bin/docker-entrypoint.sh
  alias_targets: {}
  interpreter:
  - /bin/busybox
- access: both
  aliases:
  - /usr/bin/readlink
  - /usr/bin/basename
  - /usr/bin/id
  - /bin/ls
  path: /bin/sh
  type: sunet_podman2_redis_busybox_exec_t
  target: /bin/busybox
  alias_targets:
    /usr/bin/readlink: /bin/busybox
    /usr/bin/basename: /bin/busybox
    /usr/bin/id: /bin/busybox
    /bin/ls: /bin/busybox
- access: child
  path: /usr/local/bin/redis-server
  type: sunet_podman2_redis_server_exec_t
  target: /usr/local/bin/redis-server
  alias_targets: {}
- access: runtime
  path: /usr/local/bin/redis-cli
  type: sunet_podman2_redis_cli_exec_t
  target: /usr/local/bin/redis-cli
  alias_targets: {}
module: sunet_podman2_redis
revision: '1'
tag: docker.io/library/redis:8-alpine
platform: linux/amd64
startup:
  Entrypoint:
  - docker-entrypoint.sh
  Cmd:
  - redis-server
  User: null
  WorkingDir: /data
  config_sha256: 91a1351c0bba73a5d4d6299d4436ddee5c2f0004397ee5e0536a4b6eaeb387c2
unit_contract:
  User: 999:1000
  HealthCmd: '["/usr/local/bin/redis-cli","ping"]'
