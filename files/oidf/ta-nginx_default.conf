server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;
    large_client_header_buffers 8 8k;

    client_body_buffer_size 1M;
    client_max_body_size 50M;


    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

    ssl_certificate     /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/fullchain.pem;

    ssl_early_data on;
    proxy_set_header Early-Data $ssl_early_data;
    proxy_set_header X-Forwarded-For $remote_addr;
    resolver 89.32.32.32;

    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS +RC4 RC4";

    ssl_session_cache shared:ssl_session_cache:1M;
    ssl_session_timeout 30m;

    location / {
        proxy_pass http://oidf-ta-ta-1.oidf-ta_inmor-net:8080/;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;
    large_client_header_buffers 8 8k;

    client_body_buffer_size 1M;
    client_max_body_size 50M;


    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;

    ssl_certificate     /etc/ssl/fullchain.pem;
    ssl_certificate_key /etc/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/fullchain.pem;

    ssl_early_data on;
    proxy_set_header Early-Data $ssl_early_data;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    resolver 89.32.32.32;

    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS +RC4 RC4";

    ssl_session_cache shared:ssl_session_cache:1M;
    ssl_session_timeout 30m;

    location / {
        proxy_set_header Host $host;
        proxy_pass http://oidf-ta-admin-1.oidf-ta_inmor-net:8000/;
    }
}